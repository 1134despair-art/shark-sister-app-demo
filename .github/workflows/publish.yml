name: Publish source and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.source.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect source
        id: source
        shell: bash
        run: |
          if [ -f shark-sister-app-demo-source.zip ] || [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Expand uploaded source
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          if [ -f shark-sister-app-demo-source.zip ]; then
            rm -rf .source-upload
            mkdir .source-upload
            unzip -q shark-sister-app-demo-source.zip -d .source-upload
            shopt -s dotglob nullglob
            cp -R .source-upload/* .
            rm -rf .source-upload shark-sister-app-demo-source.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat: import app source"
            git push
          fi
      - uses: actions/setup-node@v4
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: 20.17.0
          cache: npm
      - run: npm ci
        if: steps.source.outputs.ready == 'true'
      - run: npm run build:prod
        if: steps.source.outputs.ready == 'true'
      - name: Add custom domain
        if: steps.source.outputs.ready == 'true'
        run: echo "shark.ruanyi.top" > dist/build/h5/CNAME
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.ready == 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.ready == 'true'
        with:
          path: dist/build/h5

  deploy:
    if: needs.build.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
